<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.1.1/howler.min.js" type="text/javascript"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.2.3/purify.js"></script>
    <script src="https://s.ytimg.com/yts/jsbin/www-widgetapi-vflJJaNgk/www-widgetapi.js"></script>
    <script src="https://www.youtube.com/iframe_api"></script>
</head>

<body>

<div id="app">

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <div class="deck">

        <div id="savedPanel" class="savedPanel">
            <div class="queue-head">
                <h2>Saved</h2>
                <button id="saveCurrentBtn" onclick="saveCurrentSong()">Save Current</button>
            </div>
            <div class="import-actions">
                <button id="openSaveLinkBtn" class="import-action-btn" onclick="openLinkModal('song')">
                    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    <span>Save Song</span>
                </button>
                <button id="openPlaylistLinkBtn" class="import-action-btn" onclick="openLinkModal('playlist')">
                    <svg viewBox="0 0 24 24" width="15" height="15"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>
                    <span>Import Playlist</span>
                </button>
            </div>
            <div id="savedList" class="gallery"></div>
        </div>

        <div id="linkModalOverlay" class="link-modal-overlay" onclick="if (event.target === this) closeLinkModal();">
            <div id="linkModal" class="link-modal">
                <div class="link-modal-head">
                    <h3 id="linkModalTitle">Save Song</h3>
                    <button class="link-modal-close" onclick="closeLinkModal()" aria-label="Close">✕</button>
                </div>
                <input id="linkModalInput" class="link-modal-input" placeholder="Paste a YouTube link" autocomplete="off">
                <div id="linkModalError" class="link-error"></div>
                <button id="linkModalSubmit" class="link-modal-submit" onclick="submitLinkModal()">Save</button>
            </div>
        </div>

        <div id="volRail" class="vol-rail">
            <div class="top-boxes">
                <button id="saveCurrentBtn2" class="vol-btn" onclick="saveCurrentSong()" title="Save current song" aria-label="Save current song">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/><path d="M12 7.5v5M9.5 10h5" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
                    </button>
                <button id="startQueueBtn2" class="vol-btn" onclick="startQueue()" title="Start queue" aria-label="Start queue">
                        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h11M3 11h11M3 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M15 13v8l6-4-6-4z" fill="currentColor"/></svg>
                    </button>
            </div>

            <button id="volUp" class="vol-btn" title="Volume up" aria-label="Volume up">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>

            <div class="vol-meter" title="Volume">
                <svg viewBox="0 0 24 24" width="18" height="18" id="volIcon">
                    <path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/>
                    <path id="volWave1" d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                    <path id="volWave2" d="M19 6a9 9 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                </svg>
                <div id="volPct">50%</div>
            </div>

            <button id="volDown" class="vol-btn" title="Volume down" aria-label="Volume down">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>

            <div class="settings-box">
                <button id="openSettingsBtn" class="vol-btn" onclick="openSettings()" title="Settings" aria-label="Settings">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l1.9-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5a7.5 7.5 0 0 0-2.6 1.5l-2.3-.9-2 3.4 1.9 1.5a7.6 7.6 0 0 0 0 3l-1.9 1.5 2 3.4 2.3-.9a7.5 7.5 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.5 7.5 0 0 0 2.6-1.5l2.3.9 2-3.4-1.9-1.5z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
                </button>
            </div>
        </div>

        <div id="mainUI" class="carplay">

            <div class="topbar">
                <button class="close" onclick="closeUI()" aria-label="Close">✕</button>
                <div id="menuTitle">X1Studios CarPlay</div>
            </div>

            <div class="panel-toggles">
                <button id="toggleSavedBtn" class="panel-toggle-btn" onclick="toggleSavedPanel()" aria-pressed="false">
                    <span>Saved</span>
                    <span id="savedCount" class="badge">0</span>
                </button>
                <button id="toggleMiniBtn" class="panel-toggle-btn" onclick="toggleMiniPlayer()" aria-pressed="false" title="Show a small now-playing widget above the map">
                    <span>Mini Player</span>
                </button>
                <button id="toggleQueueBtn" class="panel-toggle-btn" onclick="toggleQueuePanel()" aria-pressed="false">
                    <span>Queue</span>
                    <span id="queueCount" class="badge">0</span>
                </button>
            </div>

            <div class="art-wrap">
                <img id="album" alt="">
                <div id="artPlaceholder" class="art-placeholder">
                    <svg viewBox="0 0 24 24" width="34" height="34"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
                </div>
            </div>

            <div id="settingsPanel" class="settings-panel">
        <div id="settingsHub" class="settings-view settings-view-active">
            <button class="settings-option" onclick="openSettingsView('position')">
                <span class="opt-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
                <span class="opt-text"><b>Mini Player Position</b><small>Move the mini player on screen</small></span>
                <svg class="opt-chevron" viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>

            <button id="streamerOption" class="settings-option" onclick="toggleStreamerMode()" role="switch" aria-checked="false">
                <span class="opt-icon"><svg viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 9l5 6M22 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></span>
                <span class="opt-text"><b>Streamer Mode</b><small id="streamerStatusText">Off · mutes music for you</small></span>
                <span class="switch" id="streamerSwitch"><span class="switch-knob"></span></span>
            </button>

            <button class="settings-option" onclick="openSettingsView('accent')">
                <span class="opt-icon"><span id="accentPreviewDot" class="accent-dot"></span></span>
                <span class="opt-text"><b>Accent Color</b><small id="accentNameText">Red</small></span>
                <svg class="opt-chevron" viewBox="0 0 24 24" width="16" height="16"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="link-modal-submit settings-done" onclick="closeSettings()">Done</button>
        </div>

        <div id="settingsAccent" class="settings-view">
            <div class="settings-sub-head">
                <button class="settings-back" onclick="backToSettingsHub()">← Back</button>
                <span class="settings-section-label">Accent Color</span>
            </div>
            <div id="accentGrid" class="accent-grid"></div>
        </div>
            </div>

            <div class="info">
                <div id="title">Nothing Playing</div>
                <div id="artist">Paste a link below to get started</div>
                <div id="settingsInfoTitle" class="settings-info-title">CarPlay Settings</div>
                <div id="settingsInfoSub" class="settings-info-sub">Choose an option</div>
            </div>

            <div class="progress" id="progressTrack">
                <div id="bar"><div class="scrub-handle"></div></div>
            </div>
            <div class="time-row">
                <span id="timeCur">0:00</span>
                <span id="timeDur">0:00</span>
            </div>

            <div class="controls">
                <button id="restartbtn" class="ctrl-btn icon-btn" onclick="restart()" aria-label="Restart song">
                    <svg viewBox="0 0 24 24" width="18" height="18"><rect x="4" y="5" width="3" height="14" fill="currentColor"/><path d="M19 5v14L9 12 19 5z" fill="currentColor"/></svg>
                </button>

                <button id="playpause" class="ctrl-btn" onclick="toggle()" aria-label="Play or pause"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M7 4.5v15l12-7.5-12-7.5z" fill="currentColor"/></svg></button>

                <button id="skipbtn" class="ctrl-btn icon-btn" onclick="skip()" aria-label="Skip">
                    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 5v14l10-7L5 5z" fill="currentColor"/><rect x="17" y="5" width="3" height="14" fill="currentColor"/></svg>
                </button>
            </div>

            <div class="link-row">
                <input id="link" placeholder="Paste a YouTube link" autocomplete="off">
            </div>
            <div class="link-actions">
                <button id="playbtn" onclick="submitPlay()">Play</button>
                <button id="queuebtn" onclick="submitQueue()">Add to Queue</button>
            </div>
            <div id="linkError" class="link-error"></div>

        </div>

        <div id="queuePanel" class="queuePanel">
            <div class="queue-head">
                <h2>Up Next</h2>
                <div class="queue-head-actions">
                    <button id="startQueueBtn" onclick="startQueue()">Start Queue</button>
                    <button id="clearQueueBtn" onclick="clearQueue()">Clear</button>
                </div>
            </div>
            <div id="queueList"></div>
        </div>

    </div>

</div>

<div id="settingsMenu" class="settings-menu" role="dialog" aria-label="Settings">
    <div class="settings-head">
        <h3>Mini Player Position</h3>
        <button class="link-modal-close" onclick="closeSettings()" aria-label="Close settings">✕</button>
    </div>

    <div id="settingsPosition">
        <div class="settings-sub-head">
            <button class="settings-back" onclick="backToSettingsHub()">← Back</button>
            <span class="settings-section-label">Move Mini Player</span>
        </div>
        <div class="pos-row">
        <span class="pos-label">X <small>left / right</small></span>
        <div class="pos-controls">
            <button class="vol-btn pos-btn" data-axis="x" data-dir="-1" aria-label="Move left">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
            <input id="posXVal" class="pos-val" data-axis="x" type="text" inputmode="numeric" value="0" autocomplete="off" aria-label="X position" title="Click to type a value">
            <button class="vol-btn pos-btn" data-axis="x" data-dir="1" aria-label="Move right">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>

    <div class="pos-row">
        <span class="pos-label">Y <small>down / up</small></span>
        <div class="pos-controls">
            <button class="vol-btn pos-btn" data-axis="y" data-dir="-1" aria-label="Move down">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
            <input id="posYVal" class="pos-val" data-axis="y" type="text" inputmode="numeric" value="0" autocomplete="off" aria-label="Y position" title="Click to type a value">
            <button class="vol-btn pos-btn" data-axis="y" data-dir="1" aria-label="Move up">
                <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>

    <div id="settingsStatus" class="settings-status"></div>
        <button id="settingsSaveBtn" class="link-modal-submit" onclick="savePosition()">Save</button>
    </div>

</div>

<div id="miniPlayer" class="mini-player" aria-live="polite">
    <div class="mini-head">
        <span class="mini-title-label">Mini Player</span>
        <span class="mini-vol">
            <svg viewBox="0 0 24 24" width="12" height="12" class="mini-vol-icon"><path d="M4 9v6h4l5 5V4L8 9H4z" fill="currentColor"/><path d="M16.5 8.5a5 5 0 0 1 0 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            <span id="miniVolume">50%</span>
        </span>
    </div>

    <div class="mini-body">
        <div class="mini-art-wrap">
            <img id="miniAlbum" alt="">
            <div id="miniArtPlaceholder" class="mini-art-placeholder">
                <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 18V5l12-2v13" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="18" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/><circle cx="18" cy="16" r="3" stroke="currentColor" stroke-width="1.6" fill="none"/></svg>
            </div>
        </div>

        <div class="mini-info">
            <div id="miniTitle" class="mini-song-title">Nothing Playing</div>
            <div id="miniArtist" class="mini-song-artist">—</div>
        </div>
    </div>

    <div class="mini-progress" id="miniProgressTrack">
        <div id="miniBar"></div>
    </div>
    <div class="mini-time-row">
        <span id="miniTimeCur">0:00</span>
        <span id="miniTimeDur">0:00</span>
    </div>

    <div class="mini-footer">X1Studios CarPlay</div>
</div>

<div id="trash"></div>

<script src="xsound/functions.js" type="text/javascript"></script>
<script src="xsound/SoundPlayer.js" type="text/javascript"></script>
<script src="xsound/listener.js" type="text/javascript"></script>

<script src="app.js"></script>

<script>
    document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
            if (typeof isSettingsOpen === "function" && isSettingsOpen()) {
                settingsEscape();
            } else if (typeof isLinkModalOpen === "function" && isLinkModalOpen()) {
                closeLinkModal();
            } else {
                closeUI();
            }
        }
    });
</script>

</body>
</html>
